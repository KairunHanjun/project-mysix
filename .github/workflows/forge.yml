name: Forge build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build, JUnit and headless Forge GameTests
        run: bash gradlew -p forge --no-daemon --max-workers=2 build runGameTestServer
      - name: Verify Mysix gameplay tests actually ran
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('forge/run/mysix-gametest-results.xml').getroot()
          names = {case.attrib['name'] for case in report.findall('.//testcase')}
          assert names == {'mysix:recipes', 'mysix:anvil', 'mysix:commands'}, names
          assert not report.findall('.//failure') and not report.findall('.//error')
          PY
      - name: Test with Jukebox Playlists and Sound Physics installed
        run: bash gradlew -p forge -PplaylistCompat -PsoundPhysicsCompat --no-daemon --max-workers=2 runGameTestServer
      - name: Verify optional playlist tests actually ran
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('forge/run/mysix-playlist-results.xml').getroot()
          names = {case.attrib['name'] for case in report.findall('.//testcase')}
          expected = {'sequence', 'skip', 'failure', 'duration', 'repeat', 'no_chest'}
          assert names == {'mysix_playlist:' + name for name in expected}, names
          assert not report.findall('.//failure') and not report.findall('.//error')
          PY
      - name: Validate combined client audio hooks without a game window
        run: |
          bash gradlew -p forge -PplaylistCompat -PsoundPhysicsCompat --no-daemon --max-workers=2 runClientData
          python - <<'PY'
          from pathlib import Path
          assert Path('forge/build/sound-physics-check.txt').read_text().startswith('PASS:')
          PY
      - name: Upload Forge JARs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-mysix-forge
          path: forge/build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: forge-test-reports
          path: |
            forge/build/reports/tests/
            forge/build/sound-physics-check.txt
            forge/run/logs/latest.log
            forge/run/**/*.xml
          if-no-files-found: ignore
