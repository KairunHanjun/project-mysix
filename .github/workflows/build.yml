name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and run offline and dedicated-server tests
        run: bash gradlew --no-daemon --max-workers=2 build backpackTest backpackServerTest additionsTest additionsServerTest combinedCompatTest sculkTest sculkServerTest allCompatTest visualTest visualServerTest visualCombinedTest
      - name: Calculate release checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS
      - name: Upload release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-mysix
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
  managed-tools:
    name: Managed setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install pinned tools and start localhost helper
        shell: bash
        run: bash gradlew --no-daemon --max-workers=2 managedInstallTest
      - name: Upload installation test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: managed-setup-${{ matrix.os }}
          path: |
            build/reports/tests/managedInstallTest/
            build/managed-setup-test/mysix-tools/**/logs/provider-install.stderr.log
            build/managed-setup-test/mysix-tools/**/logs/provider.stderr.log
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, managed-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: project-mysix
          path: release
      - name: Publish early release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.jar release/SHA256SUMS \
            --verify-tag --prerelease --title "Project Mysix $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
