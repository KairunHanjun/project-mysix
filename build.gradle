plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "mysix" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations { backpackTestRuntime; additionsTestRuntime; sculkTestRuntime }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Our test-only session listener supports IDE runners opening multiple sessions.
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation sourceSets.client.output
    // Test fixtures only: neither mod is bundled or required by Mysix.
    backpackTestRuntime 'maven.modrinth:travelersbackpack:SmhjfeWr'
    backpackTestRuntime 'maven.modrinth:ohNO6lps:JpKvrr9J'
    additionsTestRuntime 'maven.modrinth:addadd:1RIHaXDM'
    sculkTestRuntime 'maven.modrinth:sculk-radio:QvRrQhHR'
    // Sculk Radio's stream graph uses kotlin.Pair even without Fzzy Config installed.
    sculkTestRuntime 'maven.modrinth:fabric-language-kotlin:SKW1BTL3'
    if (providers.gradleProperty('withSculkRadio').isPresent()) {
        runtimeOnly 'maven.modrinth:sculk-radio:QvRrQhHR'
        runtimeOnly 'maven.modrinth:fabric-language-kotlin:SKW1BTL3'
    }
    if (providers.gradleProperty('withAdditions').isPresent()) {
        runtimeOnly 'maven.modrinth:addadd:1RIHaXDM'
    }
    if (providers.gradleProperty('withBackpack').isPresent()) {
        runtimeOnly 'maven.modrinth:travelersbackpack:SmhjfeWr'
        runtimeOnly 'maven.modrinth:ohNO6lps:JpKvrr9J'
    }
}

['sculkTest': 'client', 'sculkServerTest': 'server'].each { taskName, side ->
    tasks.register(taskName, Test) {
        description = 'Tests Mysix routing with the released Sculk Radio 1.0.0+26.3 JAR.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath + configurations.sculkTestRuntime
        useJUnitPlatform { excludeTags 'network' }
        filter {
            includeTestsMatching '*OnlineJukeboxTest'
            includeTestsMatching '*SculkRadioIntegrationTest'
        }
        systemProperty 'fabric.side', side
        systemProperty 'mysix.sculkTests', 'true'
    }
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(Jar).configureEach { from('LICENSE', 'THIRD_PARTY_NOTICES.md') }
test { useJUnitPlatform { excludeTags 'network' } }

tasks.register('serverTest', Test) {
    description = 'Runs jukebox lifecycle and packet tests with Fabric in dedicated-server mode.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'network' }
    filter {
        includeTestsMatching '*OnlineJukeboxTest'
        includeTestsMatching '*AudioTransferTest'
        includeTestsMatching '*BackpackPlaybackControllerTest'
        includeTestsMatching '*DiscPlaylistTest'
    }
    systemProperty 'fabric.side', 'server'
}

check.dependsOn tasks.named('serverTest')

tasks.register('backpackTest', Test) {
    description = 'Tests optional hooks with the real Traveler\'s Backpack 11.4.1 Fabric 26.3 JAR.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + configurations.backpackTestRuntime
    useJUnitPlatform { excludeTags 'network' }
    filter {
        includeTestsMatching '*BackpackIntegrationTest'
        includeTestsMatching '*BackpackPlaybackControllerTest'
        includeTestsMatching '*OnlineJukeboxTest'
    }
    systemProperty 'mysix.backpackTests', 'true'
}

tasks.register('backpackServerTest', Test) {
    description = 'Checks Backpack API and disc-slot hooks in the dedicated-server environment.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + configurations.backpackTestRuntime
    useJUnitPlatform { excludeTags 'network' }
    filter {
        includeTestsMatching '*BackpackIntegrationTest.supportedReleaseAndAllReflectedApiSignaturesMatch'
        includeTestsMatching '*BackpackIntegrationTest.realTransformedBackpackSlotAcceptsMysixExternalCdAndRejectsUnrelatedItems'
        includeTestsMatching '*BackpackPlaybackControllerTest'
        includeTestsMatching '*OnlineJukeboxTest'
    }
    systemProperty 'mysix.backpackTests', 'true'
    systemProperty 'fabric.side', 'server'
}

tasks.register('networkTest', Test) {
    description = 'Opt-in real yt-dlp downloads; requires yt-dlp, Deno and network access.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'network' }
    systemProperty 'mysix.networkTests', 'true'
    systemProperty 'mysix.integration.directory', layout.buildDirectory.dir('integration-downloads').get().asFile.absolutePath
    testLogging { showStandardStreams = true }
}

['additionsTest': 'client', 'additionsServerTest': 'server', 'combinedCompatTest': 'client', 'allCompatTest': 'client'].each { taskName, side ->
    tasks.register(taskName, Test) {
        description = 'Tests Additional Additions 10.0.14 optional album and Pocket Jukebox hooks.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath + configurations.additionsTestRuntime
        if (taskName in ['combinedCompatTest', 'allCompatTest']) classpath += configurations.backpackTestRuntime
        if (taskName == 'allCompatTest') classpath += configurations.sculkTestRuntime
        useJUnitPlatform { excludeTags 'network' }
        filter {
            includeTestsMatching '*DiscPlaylistTest'
            includeTestsMatching '*OnlineJukeboxTest'
            includeTestsMatching '*AdditionsIntegrationTest'
            if (taskName in ['combinedCompatTest', 'allCompatTest']) {
                includeTestsMatching '*BackpackIntegrationTest'
                includeTestsMatching '*BackpackPlaybackControllerTest'
            }
            if (taskName == 'allCompatTest') includeTestsMatching '*SculkRadioIntegrationTest'
        }
        systemProperty 'fabric.side', side
        systemProperty 'mysix.additionsTests', 'true'
        if (taskName in ['combinedCompatTest', 'allCompatTest']) systemProperty 'mysix.backpackTests', 'true'
        if (taskName == 'allCompatTest') systemProperty 'mysix.sculkTests', 'true'
    }
}
